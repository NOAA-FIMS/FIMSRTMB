# Checks for new releases in noaa-fims/fims on a schedule and opens an issue
# in this repository when a new release is found.
name: Check for FIMS releases

on:
  schedule:
    # Runs every Monday and Wednesday at 9:00 AM UTC
    - cron: '0 9 * * 1,3'
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check for new FIMS release
        uses: actions/github-script@v7
        with:
          script: |
            // Get the latest release from noaa-fims/fims
            const { data: latestRelease } = await github.rest.repos.getLatestRelease({
              owner: 'noaa-fims',
              repo: 'fims'
            });
            
            const releaseTag = latestRelease.tag_name;
            const issueTitle = `Update repository for FIMS ${releaseTag}`;
            
            // Check if an issue with this title already exists
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'auto-update'
            });
            
            const issueExists = existingIssues.some(issue => issue.title === issueTitle);
            
            if (issueExists) {
              console.log(`Issue for FIMS ${releaseTag} already exists. Skipping.`);
              return;
            }
            
            // Get repository ID and issue type ID for "Task" using GraphQL
            const repoQuery = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  owner {
                    ... on Organization {
                      issueTypes(first: 20) {
                        nodes {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const repoResult = await github.graphql(repoQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const repositoryId = repoResult.repository.id;
            const issueTypes = repoResult.repository.owner.issueTypes?.nodes || [];
            const taskType = issueTypes.find(t => t.name === 'Task');
            
            // Get label IDs (labels are expected to exist in the repository)
            let labelIds = [];
            try {
              const { data: autoUpdateLabel } = await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'auto-update'
              });
              labelIds.push(autoUpdateLabel.node_id);
            } catch (e) {
              console.log('Warning: auto-update label not found');
            }
            
            try {
              const { data: refactorLabel } = await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'kind: refactor'
              });
              labelIds.push(refactorLabel.node_id);
            } catch (e) {
              console.log('Warning: kind: refactor label not found');
            }
            
            // Get assignee ID
            let assigneeIds = [];
            try {
              const { data: assignee } = await github.rest.users.getByUsername({
                username: 'Andrea-Havron-NOAA'
              });
              assigneeIds.push(assignee.node_id);
            } catch (e) {
              console.log('Warning: assignee Andrea-Havron-NOAA not found');
            }
            
            // Create issue using GraphQL to support issue types
            const createIssueMutation = `
              mutation($input: CreateIssueInput!) {
                createIssue(input: $input) {
                  issue {
                    number
                    url
                  }
                }
              }
            `;
            
            const issueBody = `A new release of FIMS (${releaseTag}) has been published.\n\nThis repository should be updated to be compatible with the new FIMS release.\n\nRelease URL: ${latestRelease.html_url}`;
            
            const input = {
              repositoryId: repositoryId,
              title: issueTitle,
              body: issueBody
            };
            
            // Add assignees if found
            if (assigneeIds.length > 0) {
              input.assigneeIds = assigneeIds;
            }
            
            // Add labels if found
            if (labelIds.length > 0) {
              input.labelIds = labelIds;
            }
            
            // Add issue type if "Task" type is available
            if (taskType) {
              input.issueTypeId = taskType.id;
            }
            
            const result = await github.graphql(createIssueMutation, { input });
            
            console.log(`Created issue #${result.createIssue.issue.number} for FIMS ${releaseTag}`);
